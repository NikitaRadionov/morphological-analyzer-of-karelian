<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Морфологический анализатор карельского языка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #2b4c7e 0%, #567ebb 100%);
      color: white;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.8rem; margin-bottom: 0.4rem; }
    header p { opacity: 0.85; font-size: 0.95rem; }
    .stats {
      background: rgba(255,255,255,0.15);
      display: inline-block;
      border-radius: 20px;
      padding: 0.3rem 1rem;
      margin-top: 0.7rem;
      font-size: 0.85rem;
    }
    .container {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 1.1rem; color: #2b4c7e; margin-bottom: 1rem; }
    .input-row {
      display: flex;
      gap: 0.6rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 2px solid #d1dce8;
      border-radius: 8px;
      font-size: 1.05rem;
      transition: border-color 0.2s;
      outline: none;
    }
    input[type="text"]:focus { border-color: #567ebb; }
    button {
      padding: 0.7rem 1.5rem;
      background: #2b4c7e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #1e3560; }
    button:disabled { background: #9eb3cc; cursor: default; }

    /* Results */
    #results, #paradigm-results { margin-top: 1.2rem; }
    .result-item {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.7rem;
      background: #f8fafc;
      position: relative;
    }
    .result-item.known { border-left: 4px solid #38a169; }
    .result-item.unknown { border-left: 4px solid #d69e2e; }
    .result-lemma {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2b4c7e;
    }
    .result-tags {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #4a5568;
      margin: 0.3rem 0;
    }
    .result-desc { font-size: 0.9rem; color: #718096; }
    .badge {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-weight: 600;
    }
    .badge-known { background: #c6f6d5; color: #276749; }
    .badge-unknown { background: #fefcbf; color: #744210; }
    .badge-fst { background: #bee3f8; color: #2c5282; }
    .paradigm-link {
      font-size: 0.82rem;
      color: #567ebb;
      cursor: pointer;
      text-decoration: underline;
    }
    .paradigm-link:hover { color: #2b4c7e; }

    /* Paradigm table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      background: #2b4c7e;
      color: white;
      padding: 0.6rem 0.8rem;
      text-align: left;
    }
    td {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #e2e8f0;
    }
    tr:nth-child(even) td { background: #f8fafc; }
    .empty-msg { color: #718096; font-size: 0.95rem; padding: 0.5rem 0; }
    .error-msg { color: #c53030; padding: 0.5rem 0; }
    .loading { color: #718096; padding: 0.5rem 0; }

    /* Examples */
    .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
    .example-chip {
      background: #ebf4ff;
      color: #2b4c7e;
      padding: 0.3rem 0.8rem;
      border-radius: 16px;
      font-size: 0.88rem;
      cursor: pointer;
      border: 1px solid #bee3f8;
      transition: background 0.15s;
    }
    .example-chip:hover { background: #bee3f8; }
  </style>
</head>
<body>

<header>
  <h1>Морфологический анализатор карельского языка</h1>
  <p>Карельский Proper · New Written Karelian</p>
  <div class="stats">
    {{ stats.known_forms | int }} словоформ · {{ stats.lemmas | int }} лемм
  </div>
</header>

<div class="container">

  <!-- Analyze -->
  <div class="card">
    <h2>Анализ словоформы</h2>
    <div class="input-row">
      <input type="text" id="word-input" placeholder="Введите карельское слово..." autocomplete="off">
      <button id="analyze-btn" onclick="analyzeWord()">Анализировать</button>
    </div>
    <div class="examples">
      <strong style="align-self:center;font-size:0.85rem;color:#718096;">Примеры:</strong>
      <span class="example-chip" onclick="setAndAnalyze('huahka')">huahka</span>
      <span class="example-chip" onclick="setAndAnalyze('akan')">akan</span>
      <span class="example-chip" onclick="setAndAnalyze('ajattau')">ajattau</span>
      <span class="example-chip" onclick="setAndAnalyze('miehissä')">miehissä</span>
      <span class="example-chip" onclick="setAndAnalyze('pienempien')">pienempien</span>
      <span class="example-chip" onclick="setAndAnalyze('voittaja')">voittaja</span>
    </div>
    <div id="results"></div>
  </div>

  <!-- Paradigm -->
  <div class="card">
    <h2>Парадигма леммы</h2>
    <div class="input-row">
      <input type="text" id="lemma-input" placeholder="Введите лемму..." autocomplete="off">
      <button onclick="showParadigm()">Показать парадигму</button>
    </div>
    <div id="paradigm-results"></div>
  </div>

</div>

<script>
  const wordInput = document.getElementById('word-input');
  const lemmaInput = document.getElementById('lemma-input');

  wordInput.addEventListener('keydown', e => { if (e.key === 'Enter') analyzeWord(); });
  lemmaInput.addEventListener('keydown', e => { if (e.key === 'Enter') showParadigm(); });

  function setAndAnalyze(word) {
    wordInput.value = word;
    analyzeWord();
  }

  async function analyzeWord() {
    const word = wordInput.value.trim();
    const div = document.getElementById('results');
    if (!word) { div.innerHTML = ''; return; }
    div.innerHTML = '<div class="loading">Анализирую...</div>';

    const resp = await fetch('/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({word})
    });
    const data = await resp.json();
    if (data.error) { div.innerHTML = `<div class="error-msg">${data.error}</div>`; return; }

    if (!data.results || data.results.length === 0) {
      div.innerHTML = '<div class="empty-msg">Слово не найдено и не удалось предсказать анализ.</div>';
      return;
    }

    const sourceLabel = {fst: 'FST-анализ', lookup: 'в словаре', heuristic: 'предсказано'};
    const sourceBadge = {fst: 'badge-fst', lookup: 'badge-known', heuristic: 'badge-unknown'};

    div.innerHTML = data.results.map(r => `
      <div class="result-item ${r.is_known ? 'known' : 'unknown'}">
        <span class="badge ${sourceBadge[r.source] || (r.is_known ? 'badge-known' : 'badge-unknown')}">
          ${sourceLabel[r.source] || (r.is_known ? 'в словаре' : 'предсказано')}
        </span>
        <div class="result-lemma">${r.lemma}</div>
        <div class="result-tags">${r.tags}</div>
        <div class="result-desc">${r.description}</div>
        <span class="paradigm-link" onclick="showLemmaParadigm('${r.lemma}')">
          показать всю парадигму →
        </span>
      </div>
    `).join('');
  }

  async function showParadigm() {
    const lemma = lemmaInput.value.trim();
    renderParadigm(lemma);
  }

  async function showLemmaParadigm(lemma) {
    lemmaInput.value = lemma;
    renderParadigm(lemma);
    document.getElementById('paradigm-results').scrollIntoView({behavior: 'smooth'});
  }

  async function renderParadigm(lemma) {
    const div = document.getElementById('paradigm-results');
    if (!lemma) { div.innerHTML = ''; return; }
    div.innerHTML = '<div class="loading">Загружаю парадигму...</div>';

    const resp = await fetch('/paradigm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lemma})
    });
    const data = await resp.json();
    if (data.error) { div.innerHTML = `<div class="error-msg">${data.error}</div>`; return; }

    if (!data.forms || data.forms.length === 0) {
      div.innerHTML = `<div class="empty-msg">Лемма «${lemma}» не найдена в словаре.</div>`;
      return;
    }

    const rows = data.forms.map(f => `
      <tr>
        <td><strong>${f.form}</strong></td>
        <td><code>${f.tags}</code></td>
        <td>${f.description}</td>
      </tr>
    `).join('');

    div.innerHTML = `
      <p style="margin-bottom:0.8rem;color:#4a5568">
        Парадигма леммы <strong>${data.lemma}</strong> — ${data.forms.length} форм
      </p>
      <table>
        <thead><tr><th>Словоформа</th><th>Теги</th><th>Описание</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }
</script>
</body>
</html>
